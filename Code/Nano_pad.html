<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Macropad Config</title>
  <style>
    :root {
      --bg: #000;
      --panel: #0d0d0d;
      --panel-alt: #111;
      --border: #1a1a1a;
      --text-main: #e5e5e5;
      --text-muted: #666;
      --success: #22c55e;
      --danger: #ff4b4b;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .shell {
      width: 100%;
      max-width: 1300px;
      height: 95vh;
      display: grid;
      grid-template-columns: 0.9fr 0.9fr 1.2fr;
      grid-template-rows: 1fr 60px;
      gap: 20px;
      background: var(--bg);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid #181818;
      box-shadow: 0 24px 60px rgba(0,0,0,0.85);
    }

    .left, .middle, .right {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .right {
      overflow-y: auto;
      padding-right: 6px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .subtitle {
      margin: 0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .chip {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #262626;
      background: #050505;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34,197,94,0.8);
    }

    button {
      border: none;
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 999px;
      background: #f5f5f5;
      color: #000;
      font-size: 13px;
    }

    button.secondary {
      background: #151515;
      color: var(--text-main);
      border: 1px solid #262626;
    }

    .panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid var(--border);
    }

    .panel-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    label {
      font-size: 11px;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }

    select, input {
      width: 100%;
      background: #0d0d0d;
      border-radius: 999px;
      border: 1px solid #222;
      padding: 7px 10px;
      font-size: 12px;
      color: var(--text-main);
      outline: none;
    }

    .dropzone {
      border: 2px dashed #333;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      transition: 0.2s;
      cursor: pointer;
    }

    .dropzone.dragover {
      border-color: var(--success);
      color: var(--success);
      background: #050505;
    }

    .preview {
      margin-top: 10px;
      width: 128px;
      height: 64px;
      background: #000;
      border: 1px solid #333;
      image-rendering: pixelated;
      display: block;
    }

    .status-bar {
      grid-column: 1 / 4;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .success { border-color: var(--success); color: var(--success); }
    .error { border-color: var(--danger); color: var(--danger); }

    .button-block {
      margin-bottom: 12px;
      background: var(--panel-alt);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #202020;
    }

    .button-block-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .three-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .small-select, .small-input {
      font-size: 11px;
      padding: 5px 8px;
      height: 30px;
      background: #0d0d0d;
      border: 1px solid #222;
      color: #e5e5e5;
    }

    .device-disconnected {
      filter: grayscale(100%) brightness(0.5);
      opacity: 0.6;
    }

    .device-connected {
      filter: none;
      opacity: 1;
    }
  </style>
</head>

<script>
  function setStatus(type, msg) {
    const icon = document.getElementById('statusIcon');
    const text = document.getElementById('statusText');
    icon.classList.remove('success', 'error');

    if (type === 'success') {
      icon.classList.add('success');
      icon.textContent = '✓';
    } else if (type === 'error') {
      icon.classList.add('error');
      icon.textContent = '✕';
    } else {
      icon.textContent = '•';
    }

    text.textContent = msg;
  }

  let port, writer, reader;

  document.getElementById('connect').onclick = async () => {
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });

      writer = port.writable.getWriter();
      reader = port.readable.getReader();

      document.getElementById('deviceSVG').classList.remove('device-disconnected');
      document.getElementById('deviceSVG').classList.add('device-connected');

      setStatus('success', 'Connected');

      (async () => {
        const decoder = new TextDecoder();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) {
            const text = decoder.decode(value);
            if (text.includes("OK")) setStatus('success', 'Success');
            if (text.includes("ERR")) setStatus('error', 'Device error');
          }
        }
      })();
    } catch {
      document.getElementById('deviceSVG').classList.add('device-disconnected');
      setStatus('error', 'Connection failed');
    }
  };

  async function sendLine(line) {
    if (!writer) return setStatus('error', 'Not connected');
    await writer.write(new TextEncoder().encode(line + "\n"));
    setStatus('idle', 'Command sent…');
  }

  function toggleCustom(selectId, inputId) {
    const sel = document.getElementById(selectId);
    const inp = document.getElementById(inputId);
    inp.style.display = sel.value === "CUSTOM" ? "block" : "none";
  }

  function getMacro(selectId, inputId) {
    const sel = document.getElementById(selectId).value;
    const txt = document.getElementById(inputId).value.trim();
    if (sel === "CUSTOM") return txt || null;
    return sel || null;
  }

  const holdSlider = document.getElementById("holdSlider");
  const holdValue = document.getElementById("holdValue");
  holdSlider.oninput = () => holdValue.textContent = holdSlider.value + " ms";

  const doubleSlider = document.getElementById("doubleSlider");
  const doubleValue = document.getElementById("doubleValue");
  doubleSlider.oninput = () => doubleValue.textContent = doubleSlider.value + " ms";

  function applyButton(n) {
    const single = getMacro(`single${n}`, `singleText${n}`);
    const hold = getMacro(`hold${n}`, `holdText${n}`);
    const dbl = getMacro(`double${n}`, `doubleText${n}`);

    const holdTime = holdSlider.value;
    const dblWindow = doubleSlider.value;

    if (!single && !hold && !dbl) {
      setStatus('error', `Button ${n}: nothing set`);
      return;
    }

    if (single) sendLine(`SET ${n} SINGLE ${single}`);
    if (hold) sendLine(`SET ${n} HOLD ${hold} ${holdTime}`);
    if (dbl) sendLine(`SET ${n} DOUBLE ${dbl} ${dblWindow}`);

    setStatus('success', `Button ${n} updated`);
  }

  const screenMode = document.getElementById('screenMode');
  const screenTextRow = document.getElementById('screenTextRow');
  const imageBox = document.getElementById('imageBox');
  const screenText = document.getElementById('screenText');
  const petBox = document.getElementById('petBox');

  screenMode.onchange = () => {
    const mode = screenMode.value;
    screenTextRow.style.display = mode === 'TEXT' ? 'block' : 'none';
    imageBox.style.display = mode === 'IMG' ? 'block' : 'none';
    petBox.style.display = mode === 'PET' ? 'block' : 'none';
  };

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const ctx = preview.getContext('2d');

  dropzone.onclick = () => fileInput.click();

  dropzone.ondragover = e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  };

  dropzone.ondragleave = () => dropzone.classList.remove('dragover');

  dropzone.ondrop = e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    handleFile(e.dataTransfer.files[0]);
  };

  fileInput.onchange = e => handleFile(e.target.files[0]);

  function updateSvgPreview() {
    const svgImg = document.getElementById("svgScreenPreview");
    const dataURL = preview.toDataURL("image/png");
    svgImg.setAttribute("href", dataURL);
  }

  function handleFile(file) {
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      preview.width = 128;
      preview.height = 64;
      ctx.drawImage(img, 0, 0, 128, 64);

      const imgData = ctx.getImageData(0, 0, 128, 64);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const avg = (imgData.data[i] + imgData.data[i+1] + imgData.data[i+2]) / 3;
        const bw = avg > 128 ? 255 : 0;
        imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = bw;
      }
      ctx.putImageData(imgData, 0, 0);
      updateSvgPreview();
    };
    img.src = URL.createObjectURL(file);
  }

  document.getElementById('applyScreen').onclick = () => {
    const mode = screenMode.value;
    if (!mode) return setStatus('error', 'Select a mode');

    if (mode === 'TEXT') {
      const t = screenText.value.trim();
      if (!t) return setStatus('error', 'Enter text');

      preview.width = 128;
      preview.height = 64;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, 128, 64);
      ctx.fillStyle = "#fff";
      ctx.font = "12px monospace";
      ctx.fillText(t, 4, 32);
      updateSvgPreview();

      return sendLine(`SCREEN TEXT "${t.replace(/"/g,"'")}"`);
    }

    if (mode === 'IMG') {
      const imgData = ctx.getImageData(0, 0, 128, 64).data;
      let bits = "";

      for (let y = 0; y < 64; y++) {
        for (let x = 0; x < 128; x++) {
          const i = (y * 128 + x) * 4;
          const v = imgData[i] > 128 ? 1 : 0;
          bits += v ? "1" : "0";
        }
      }

      updateSvgPreview();
      return sendLine(`SCREEN IMG ${bits}`);
    }

    if (mode === 'PET') {
      sendLine("SCREEN PET ENABLE");
      sendLine(`PET TYPE ${petType.value}`);
      sendLine(`PET HUNGER_RATE ${petFeedRate.value}`);
      sendLine(`PET SLEEP_TIME ${petSleepTime.value}`);
      updatePetToPreview();
      return;
    }

    sendLine(`SCREEN ${mode}`);
  };

  const petCanvas = document.getElementById("petPreview");
  const petCtx = petCanvas.getContext("2d");
  const petType = document.getElementById("petType");
  const petFeedRate = document.getElementById("petFeedRate");
  const petFeedRateValue = document.getElementById("petFeedRateValue");
  const petSleepTime = document.getElementById("petSleepTime");
  const petSleepTimeValue = document.getElementById("petSleepTimeValue");
  const feedPet = document.getElementById("feedPet");
  const resetPet = document.getElementById("resetPet");

  petFeedRate.oninput = () =>
    petFeedRateValue.textContent = petFeedRate.value;

  petSleepTime.oninput = () =>
    petSleepTimeValue.textContent = petSleepTime.value + "s";

  function drawPet(state="idle") {
    petCtx.fillStyle = "#000";
    petCtx.fillRect(0,0,64,32);

    petCtx.fillStyle = "#fff";

    const type = petType.value;

    if (type === "blob") {
      petCtx.fillRect(20, 12, 24, 12);
      petCtx.fillRect(24, 10, 16, 4);
      petCtx.fillRect(26, 8, 12, 2);
    }

    if (type === "cat") {
      petCtx.fillRect(20, 14, 24, 10);
      petCtx.fillRect(22, 10, 6, 6);
      petCtx.fillRect(36, 10, 6, 6);
    }

    if (type === "ghost") {
      petCtx.fillRect(20, 10, 24, 16);
      petCtx.fillRect(20, 26, 6, 4);
      petCtx.fillRect(26, 26, 6, 4);
      petCtx.fillRect(32, 26, 6, 4);
      petCtx.fillRect(38, 26, 6, 4);
    }

    petCtx.fillRect(28, 14, 2, 2);
    petCtx.fillRect(34, 14, 2, 2);

    if (state === "happy") {
      petCtx.fillRect(30, 18, 8, 2);
    }
  }

  function updatePetToPreview() {
    preview.width = 128;
    preview.height = 64;
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,128,64);
    ctx.drawImage(petCanvas, 32, 16, 32, 16);
    updateSvgPreview();
  }

  drawPet("idle");

  feedPet.onclick = () => {
    drawPet("happy");
    updatePetToPreview();
    sendLine("PET FEED");
    setTimeout(() => {
      drawPet("idle");
      updatePetToPreview();
    }, 800);
  };

  resetPet.onclick = () => {
    sendLine("PET RESET");
    drawPet("idle");
    updatePetToPreview();
  };
</script>

</body>
</html>
